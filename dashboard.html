<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Investimento Lucrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background: var(--soft);">
  
  <header class="header">
    <div class="brand">
      <span class="brand-mark">IL</span><span>investimento<br><b>lucrativo</b></span>
    </div>
    <nav>
      <a href="#" style="color: var(--ink); font-weight: 700;">Resumo</a>
      <a href="#">Meus Planos</a>
      <a href="#">Extrato</a>
    </nav>
    <div class="header-actions">
      <span id="user-greeting" style="font-size: 12px; font-weight: 700; margin-right: 15px;">Olá, Usuário</span>
      <button class="outline" id="logout-btn" style="padding: 8px 12px;">Sair</button>
    </div>
  </header>

  <main class="section" style="padding-top: 40px; max-width: 1000px;">
    
    <div style="display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap;">
      <div class="dashboard-card" style="flex: 1; min-width: 300px;">
        <div class="card-top"><span>SALDO DISPONÍVEL</span></div>
        <p class="balance" id="available-balance">R$ 0<span>,00</span></p>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="button small" style="background: white; color: black; flex: 1;">Aportar (Pix)</button>
            <button class="outline" style="border-color: white; color: white; flex: 1;">Sacar</button>
        </div>
      </div>
      
      <div class="dashboard-card" style="flex: 1; background: white; color: var(--ink); border: 1px solid var(--line); box-shadow: none;">
        <div class="card-top" style="color: var(--muted);"><span>SALDO APLICADO</span></div>
        <p class="balance" id="invested-balance">R$ 0<span>,00</span></p>
        <div class="card-stats" style="border-color: #eee;">
          <div><span>Rendimentos</span><b class="positive" style="color: #10b981;">+ R$ 0,00</b></div>
          <div><span>Plano Ativo</span><b style="color: var(--ink);">Nenhum</b></div>
        </div>
      </div>
    </div>

    <h3 style="font-size: 18px; margin-bottom: 20px;">Últimas Movimentações</h3>
    <div style="background: white; border: 1px solid var(--line); border-radius: 4px;">
      <!-- Dados preenchidos via JS -->
      <div id="transactions-list" style="padding: 20px; font-size: 13px; color: var(--muted); text-align: center;">
        Nenhuma transação encontrada.
      </div>
    </div>

  </main>

  <script src="dashboard.js"></script>
</body>
</html>
