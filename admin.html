<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin | Investimento Lucrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background: var(--soft);">
  
  <header class="header">
    <a href="#" class="brand">
      <span class="brand-mark" style="background: #ef4444;">IL</span><span>admin<br><b>lucrativo</b></span>
    </a>
    <nav style="display: flex; gap: 20px;">
      <a href="#dashboard" style="color: var(--ink); font-weight: 700;">Visão Geral</a>
      <a href="#saques">Saques (Pix)</a>
      <a href="#usuarios">Usuários</a>
    </nav>
    <div class="header-actions">
      <button class="outline" id="admin-logout-btn" style="padding: 8px 12px;">Sair do Painel</button>
    </div>
  </header>

  <main class="section" style="padding-top: 40px; max-width: 1200px;">
    
    <!-- DASHBOARD ADMINISTRATIVO -->
    <section id="dashboard" style="margin-bottom: 60px;">
      <h2 style="font-size: 24px; margin-bottom: 20px;">Resumo Financeiro</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        
        <div class="dashboard-card" style="background: white; border: 1px solid var(--line); color: var(--ink); box-shadow: none;">
          <div class="card-top" style="color: var(--muted);"><span>VOLUME DE APORTES</span></div>
          <p class="balance" id="admin-total-deposits" style="color: #10b981;">R$ 0,00</p>
        </div>
        
        <div class="dashboard-card" style="background: white; border: 1px solid var(--line); color: var(--ink); box-shadow: none;">
          <div class="card-top" style="color: var(--muted);"><span>SAQUES PENDENTES</span></div>
          <p class="balance" id="admin-pending-withdrawals" style="color: #ef4444;">0</p>
        </div>
        
        <div class="dashboard-card" style="background: white; border: 1px solid var(--line); color: var(--ink); box-shadow: none;">
          <div class="card-top" style="color: var(--muted);"><span>USUÁRIOS ATIVOS</span></div>
          <p class="balance" id="admin-active-users">0</p>
        </div>

      </div>
    </section>

    <!-- GESTÃO DE SAQUES -->
    <section id="saques" style="margin-bottom: 60px;">
      <h2 style="font-size: 24px; margin-bottom: 20px;">Solicitações de Saque Pendentes</h2>
      <div style="background: white; border: 1px solid var(--line); border-radius: 4px; overflow-x: auto;">
        <table style="width: 100%; text-align: left; border-collapse: collapse; font-size: 13px; min-width: 600px;">
          <thead style="background: #f5f5f4; font-size: 11px; color: var(--muted);">
            <tr>
              <th style="padding: 15px;">Usuário</th>
              <th style="padding: 15px;">Valor Solicitado</th>
              <th style="padding: 15px;">Chave Pix (Destino)</th>
              <th style="padding: 15px;">Data</th>
              <th style="padding: 15px; text-align: right;">Ações de Aprovação</th>
            </tr>
          </thead>
          <tbody id="admin-withdrawals-list">
            <!-- Preenchido via admin.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>
  
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
